<div class="col-12 p-0 mb-2">
  <app-breadcrumbs [items]="items"></app-breadcrumbs>
</div>


<div class="col-12 card text-right mb-2">
  <p-button icon="pi pi-plus" styleClass="p-button-info" (click)="showData()" label="Dodaj novu obavezu" class="mr-2"></p-button>
</div>



<div class="grid">
  <div class="col-12">
      <div class="card">
          <p-table
              #dt1
              [value]="vrste$ | async"
              dataKey="id"
              [rows]="5"
              [showCurrentPageReport]="true"
              [rowsPerPageOptions]="[5, 10, 25, 50]"
              [paginator]="true"
              currentPageReportTemplate="Prikaži od {first} do {last} od ukupno {totalRecords} redova"
              [globalFilterFields]="['id','naziv']"
              >
              <ng-template pTemplate="header">
                  <tr>
                      <th pSortableColumn="id">
                          <div class="flex align-items-center">
                              Šifra
                              <p-sortIcon field="id"></p-sortIcon>
                          </div>
                      </th>
                      <th pSortableColumn="naziv" style="width: 80%">
                          <div class="flex align-items-center">
                              Naziv obaveze
                              <p-sortIcon field="naziv"></p-sortIcon>
                              <p-columnFilter type="text" field="naziv" display="menu" class="ml-auto"></p-columnFilter>
                          </div>
                      </th>

                      <th>
                        <div class="flex align-items-center" style="width: 10rem">
                            Akcija
                        </div>
                      </th>

                  </tr>
              </ng-template>
              <ng-template pTemplate="body" let-data>
                  <tr>
                      <td>{{data.id   }}</td>
                      <td>{{data.naziv}}</td>
                      <td  class="text-right">
                        <!-- <p-button (click)="editData(data)" type="button" class="mr-1" styleClass="p-button-info" icon="pi pi-pencil"></p-button> -->
                        <p-button (click)="deleteData(data.id)" type="button" icon="pi pi-trash"></p-button>
                    </td>
                  </tr>
              </ng-template>
              <ng-template pTemplate="emptymessage">
                  <tr>
                      <td colspan="9">Nema podataka.</td>
                  </tr>
              </ng-template>
          </p-table>
      </div>
  </div>
</div>




<p-dialog header="Vrsta poreske obaveze" [(visible)]="visible" [style]="{width: '30vw'}" modal="true">
  <div class="grid mt-1">

    <div class="col-12 flex flex-column gap-2">
      <label htmlFor="username">Naziv obaveze</label>
      <input pInputText id="username" aria-describedby="username-help" [(ngModel)]="name" />
    </div>
    <div class="col-12 text-right">
      <p-button *ngIf="mode == 1" label="Kreiraj" icon="pi pi-plus" styleClass="p-button-outlined p-button-success" (click)="create()"></p-button>
      <!-- <p-button *ngIf="mode == 2" label="Sačuvaj" icon="pi pi-plus" styleClass="p-button-outlined p-button-success" (click)="updateData()"></p-button> -->
    </div>
  </div>
</p-dialog>
