<div class="col-12 p-0 mb-2">
  <app-breadcrumbs [items]="items"></app-breadcrumbs>
</div>


<div class="col-12 card text-right mb-2">
  <p-button *ngIf="user.tip == 1" icon="pi pi-plus" styleClass="p-button-info" (click)="showData()" label="Dodaj novi red" class="mr-2"></p-button>
  <p-dropdown [options]="months" [(ngModel)]="selectedMonth" optionLabel="label" optionValue="value" [style]="{'width':'30%'}" class="text-left mr-2" [filter]="true"></p-dropdown>
  <p-dropdown [options]="obaveza$ | async" [(ngModel)]="selectedObavezaPretraga" optionLabel="naziv" optionValue="id" placeholder="Vrsta poreske prijave" [style]="{'width':'30%'}" class="text-left" [filter]="true"></p-dropdown>
  <p-button icon="pi pi-search" (click)="pretraga()" class="ml-2"></p-button>
</div>


<div class="grid">
  <div class="col-12">
      <div class="card">
          <p-table
              #dt1
              [value]="info$ | async"
              dataKey="id"
              [rows]="10"
              [showCurrentPageReport]="true"
              [rowsPerPageOptions]="[10, 25, 50]"
              [paginator]="true"
              currentPageReportTemplate="Prikaži od {first} do {last} od ukupno {totalRecords} redova"
              [globalFilterFields]="['rfq','incoterms', 'date', 'endDate', 'items', 'status','numberOffer']"
              >
              <ng-template pTemplate="header">
                  <tr>
                      <th pSortableColumn="rfq">
                          <div class="flex align-items-center">
                              Datum
                              <p-sortIcon field="rfq"></p-sortIcon>
                          </div>
                      </th>
                      <th pSortableColumn="incoterms" style="width: 20%">
                          <div class="flex align-items-center">
                              Opis obaveze
                              <p-sortIcon field="incoterms"></p-sortIcon>
                              <p-columnFilter type="text" field="incoterms" display="menu" class="ml-auto"></p-columnFilter>
                          </div>
                      </th>
                      <th pSortableColumn="date">
                          <div class="flex align-items-center">
                              Vrsta poreske prijave
                              <p-sortIcon field="date"></p-sortIcon>
                              <p-columnFilter type="text" field="date" display="menu" class="ml-auto"></p-columnFilter>
                          </div>
                      </th>
                      <th pSortableColumn="status" style="width: 30%">
                          <div class="flex align-items-center">
                            Zakonski osnov
                              <p-sortIcon field="status"></p-sortIcon>
                              <p-columnFilter type="text" field="status" display="menu" class="ml-auto"></p-columnFilter>
                          </div>
                      </th>
                      <th pSortableColumn="status">
                        <div class="flex align-items-center">
                            Način dostavljanja
                        </div>
                      </th>
                      <th  *ngIf="user.tip == 1" >
                        <div class="flex align-items-center" style="width: 10rem">
                            Akcija
                        </div>
                    </th>

                  </tr>
              </ng-template>
              <ng-template pTemplate="body" let-data>
                  <tr>
                      <td>{{data.datum_vazenja | date:'dd-MM-yyyy'  }}</td>
                      <td>{{data.opis_obaveze}}</td>
                      <td>{{data.vrsta_poreske_prijave}}</td>
                      <td>{{data.zakonski_osnov}}</td>
                      <td>
                        <div *ngIf="data.portal"><i class="pi pi-check" style="color: green"></i> Portal ePorezi</div>
                        <div *ngIf="data.pisarnica"><i class="pi pi-check" style="color: green"></i> Pisarnica Poreske uprave</div>
                      </td>
                      <td *ngIf="user.tip == 1" class="text-right">
                        <p-button (click)="editData(data)" type="button" class="mr-1" styleClass="p-button-info" icon="pi pi-pencil"></p-button>
                        <p-button (click)="deleteData(data.id)" type="button" icon="pi pi-trash"></p-button>
                    </td>
                  </tr>
              </ng-template>
              <ng-template pTemplate="emptymessage">
                  <tr>
                      <td colspan="9">Nema podataka.</td>
                  </tr>
              </ng-template>
          </p-table>
      </div>
  </div>
</div>




<p-dialog header="e-Rokovi (Poreski rokovi)" [(visible)]="visible" [style]="{width: '50vw', height: '70hv'}" modal="true">
  <div class="grid mt-1">
    <div class="col-6 flex flex-column gap-2">
      <label htmlFor="username">Vrsta poreske obaveze</label>
      <p-dropdown [options]="obaveza$ | async" [(ngModel)]="selectedObaveza" optionLabel="naziv" optionValue="id" placeholder="Vrsta poreske prijave" [style]="{'width':'100%'}" class="text-left" [filter]="true"></p-dropdown>
    </div>
    <div class="col-6 flex flex-column gap-2">
      <label htmlFor="username">Datum</label>
      <p-calendar
        [(ngModel)]="firstDate"
        dateFormat="yy-mm-dd"
        showIcon="true"
        [style]="{'width':'100%'}"
      ></p-calendar>
    </div>
    <div class="col-12 flex flex-column gap-2">
      <label htmlFor="username">Opis obaveze</label>
      <input pInputText id="username" aria-describedby="username-help" [(ngModel)]="tema" />
    </div>
    <div class="col-12 flex flex-column gap-2">
      <label htmlFor="username">Zakonski osnov </label>
      <textarea
        rows="15"
        cols="50"
        pInputTextarea
        [(ngModel)]="zakonski_osnov">
      </textarea>
    </div>
    <div class="col-12">
      Način dostavljanja
    </div>
    <div class="flex flex-column gap-2 col-3">
      <label htmlFor="username">Pisarnica Poreske uprave</label>
      <p-inputSwitch [(ngModel)]="pisarnica"></p-inputSwitch>
    </div>
    <div class="flex flex-column gap-2 col-3">
      <label htmlFor="username">Portal ePorezi</label>
      <p-inputSwitch [(ngModel)]="portal"></p-inputSwitch>
    </div>


    <div class="col-12 text-right">
      <p-button *ngIf="mode == 1" label="Kreiraj" icon="pi pi-plus" styleClass="p-button-outlined p-button-success" (click)="create()"></p-button>
      <p-button *ngIf="mode == 2" label="Sačuvaj" icon="pi pi-plus" styleClass="p-button-outlined p-button-success" (click)="updateData()"></p-button>
    </div>
  </div>
</p-dialog>
